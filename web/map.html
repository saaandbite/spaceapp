<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Map — Is It a Meteor Shower?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>

  <!-- ===== NAV ===== -->
  <nav class="nav-bar">
    <span class="nav-logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="16.5" cy="7.5" r="3.4" fill="currentColor" stroke="none"/><path d="M13.5 10.5 5 19"/><path d="M15.8 12.8 10 18.5"/></svg> Is It a Meteor Shower?</span>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="nav-links">
      <a class="nav-link" href="index.html">The Documentary</a>
      <a class="nav-link" href="map.html">Treasure Map</a>
      <a class="nav-link" href="simulator.html">Drop a Meteor!</a>
    </div>
  </nav>

  <!-- ===== MAP PAGE ===== -->
  <div class="map-page">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>🗺️ Treasure Map</h3>

      <!-- Mode Toggle -->
      <div class="btn-group">
        <button class="btn-toggle active" id="btn-global">🌍 Global</button>
        <button class="btn-toggle" id="btn-indonesia">🇮🇩 Indonesia</button>
      </div>

      <!-- Layer Toggles -->
      <label class="check-row">
        <input type="checkbox" id="chk-fireballs"> Show CNEOS Fireballs (888 bolides)
      </label>
      <label class="check-row">
        <input type="checkbox" id="chk-clusters"> Show K-Means Clusters
      </label>

      <!-- Pin List -->
      <div id="pin-list" style="flex:1; overflow-y:auto"></div>

      <!-- Detail Card -->
      <div class="detail-card hidden" id="pin-detail">
        <h3 id="detail-name"></h3>
        <dl>
          <dt>Year</dt>    <dd id="detail-year"></dd>
          <dt>Class</dt>   <dd id="detail-class"></dd>
          <dt>Mass</dt>    <dd id="detail-mass"></dd>
          <dt>Type</dt>    <dd id="detail-type"></dd>
          <dt>Material</dt><dd id="detail-material"></dd>
          <dt>Regime</dt>  <dd id="detail-regime"></dd>
          <dt>Energy</dt>  <dd id="detail-energy"></dd>
        </dl>
      </div>

      <!-- Footage Player -->
      <div class="control-section" style="margin-top:auto; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,.08)">
        <div class="collapsible-header">
          <h4 style="margin:0; font-size:.8rem">📹 Historical Bolide Video</h4>
        </div>
        <div class="collapsible-body">
          <video controls muted playsinline style="width:100%; border-radius:8px; margin-top:.5rem" poster="../assets/images/chelyabinsk_meteor_panorama_02.webp">
            <source src="../assets/videos/YTDown.com_YouTube_Media_K01woThoJrM_Chelyabinsk-Meteor-The-Flash-That-Shook-a-City_001_1080p.mp4" type="video/mp4">
          </video>
          <p class="text-muted" style="font-size:.72rem; margin-top:.3rem">Dashcam footage: Chelyabinsk superbolide exploding over the southern Ural region.</p>
        </div>
      </div>
    </aside>

    <!-- Map -->
    <div class="map-container" id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/page2.js"></script>
</body>
</html>
